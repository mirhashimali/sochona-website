name: Google Maps Lead Scraper Pipeline

on:
  repository_dispatch:
    types: [scrape_gmaps]
  workflow_dispatch: # <--- This adds the manual "Run" button in GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Scraper
        env:
          # If triggered manually, it defaults to Plumbers in Gurugram
          CLIENT_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || '{"keyword":"Plumbers","location":"Gurugram","radius":5,"unit":"Kilometers (km)"}' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: node scripts/gmaps-scraper.js
